# Continuous Delivery: runs when a PR is merged (push to main).
#
#   release      -> builds the prod target end to end on a clean database
#                   (a "release candidate" check of main), generates docs and
#                   stores the prod manifest.json (the state used for Slim CI).
#   publish-docs -> publishes the dbt docs site to GitHub Pages.
#                   Opt-in: set repository variable PUBLISH_DOCS = true and
#                   Settings > Pages > Source = "GitHub Actions".
#
# To deploy into a warehouse you actually keep (your laptop's Postgres), see
# deploy-local.yml (self-hosted runner).
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cd-main
  cancel-in-progress: false   # never cancel a deployment half way

env:
  DBT_TARGET: prod
  DBT_HOST: localhost
  DBT_PORT: "5432"
  DBT_USER: dbt
  DBT_PASSWORD: dbt
  DBT_DATABASE: warehouse

jobs:
  release:
    name: Build prod target
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbt
          POSTGRES_PASSWORD: dbt
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dbt -d warehouse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: dbt deps

      - name: Land raw data
        run: |
          python scripts/load_raw.py --batch 1
          python scripts/load_raw.py --batch 2

      - name: dbt build --target prod
        run: dbt build

      - name: Generate docs
        run: |
          dbt docs generate
          mkdir -p site
          cp target/index.html target/manifest.json target/catalog.json site/

      - name: Save prod manifest (state for Slim CI / deferral)
        uses: actions/upload-artifact@v7
        with:
          name: prod-manifest
          path: target/manifest.json
          retention-days: 30

      - name: Upload docs site
        if: vars.PUBLISH_DOCS == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish-docs:
    name: Publish dbt docs to GitHub Pages
    needs: release
    if: vars.PUBLISH_DOCS == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
