snapshots:
  - name: snp_customers
    description: >
      SCD Type 2 history of customers. Each time a customer's record changes
      (detected via updated_at) the old row is closed (dbt_valid_to) and a new
      current row is inserted.
    relation: ref('slv_customers')
    config:
      unique_key: customer_id
      strategy: timestamp
      updated_at: updated_at
      dbt_valid_to_current: "cast('9999-12-31' as timestamp)"
